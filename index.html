<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fake Review Detector</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Fake E-commerce Review Detection</h1>
      <p class="subtitle">
        Enter a product URL to analyze whether its reviews are fake or genuine.
      </p>

      <form action="/predict" method="POST" class="form-box">
        <input
          type="text"
          name="url"
          placeholder="Paste product URL here"
          required
        />
        <button type="submit">Analyze Reviews</button>
      </form>

      <p class="note">
        This system uses machine learning to analyze online reviews.
      </p>
    </div>
  </body>
</html>
